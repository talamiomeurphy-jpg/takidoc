<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Éditeur - TakiDoc</title>
    <meta name="description" content="Personnalisez votre document professionnel">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        /* ============================================
           1. IDENTITÉ VISUELLE UNIFIÉE (Même que index.html)
           ============================================ */
        :root {
            --primary: #FF6B35;
            --primary-dark: #E85A2D;
            --primary-light: #FFF5F0;
            --secondary: #004E89;
            --dark: #1A1A2E;
            --bg-body: #FAFAFA;
            --bg-card: #FFFFFF;
            --text-main: #1A1A2E;
            --text-muted: #6B7280;
            --text-light: #9CA3AF;
            --border: #E5E7EB;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 10px 30px rgba(0,0,0,0.12);
            --radius-sm: 8px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-full: 9999px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html { scroll-behavior: smooth; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* ============================================
           2. HEADER UNIFIÉ ET RESPONSIVE
           ============================================ */
        .editor-nav {
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 12px 24px;
            z-index: 1000;
            border-bottom: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 900;
            text-decoration: none;
            letter-spacing: -1px;
            display: flex;
            align-items: center;
            transition: var(--transition);
        }
        .logo:hover { transform: scale(1.02); }
        .logo-taki { color: var(--primary); }
        .logo-doc { color: var(--dark); }

        .nav-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 8px 16px;
            border-radius: var(--radius-full);
            background: var(--bg-body);
            border: 1px solid var(--border);
            transition: var(--transition);
        }
        .nav-back:hover { color: var(--primary); border-color: var(--primary); background: white; }

        .editor-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar-toggle {
            display: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: transparent;
            border: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
            color: var(--text-muted);
            transition: var(--transition);
        }
        .sidebar-toggle:hover { background: var(--primary-light); color: var(--primary); }

        /* ============================================
           3. BOUTONS UNIFIÉS
           ============================================ */
        .btn {
            padding: 10px 20px;
            border-radius: var(--radius-full);
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
            transition: var(--transition);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
        }

        .btn-sm { padding: 8px 16px; font-size: 0.85rem; }
        
        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(255,107,53,0.3);
        }
        .btn-primary:hover { background: var(--primary-dark); transform: translateY(-2px); }

        .btn-secondary {
            background: white;
            color: var(--dark);
            border: 2px solid var(--border);
        }
        .btn-secondary:hover { border-color: var(--primary); color: var(--primary); }

        .btn-full { width: 100%; padding: 14px; font-size: 1rem; }

        .btn-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: white;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1rem;
            color: var(--text-main);
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }
        .btn-icon:hover { background: var(--primary); color: white; border-color: var(--primary); transform: scale(1.1); }
        .btn-icon:active { transform: scale(0.95); }

        /* ============================================
           4. LAYOUT ÉDITEUR
           ============================================ */
        .editor-layout {
            display: grid;
            grid-template-columns: 380px 1fr;
            min-height: calc(100vh - 65px);
        }

        /* Sidebar */
        .editor-sidebar {
            background: white;
            border-right: 1px solid var(--border);
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            height: calc(100vh - 65px);
            position: sticky;
            top: 65px;
        }

        .sidebar-header { padding-bottom: 16px; border-bottom: 1px solid var(--border); }
        .sidebar-header h2 { font-size: 1.25rem; font-weight: 800; color: var(--dark); margin-bottom: 8px; }
        
        .category-badge {
            display: inline-block;
            background: var(--primary-light);
            color: var(--primary-dark);
            padding: 4px 12px;
            border-radius: var(--radius-full);
            font-size: 0.75rem;
            font-weight: 700;
        }

        .sidebar-section {
            background: var(--bg-body);
            padding: 20px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
        }
        .sidebar-section h3 {
            font-size: 0.95rem;
            color: var(--dark);
            margin-bottom: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sidebar-section h3 i { color: var(--primary); }

        /* Formulaires */
        .form-field { margin-bottom: 16px; }
        .form-field label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; }
        .form-field input, .form-field textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 0.9rem;
            transition: var(--transition);
            background: white;
        }
        .form-field input:focus, .form-field textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255,107,53,0.1);
        }
        .form-field textarea { resize: vertical; min-height: 100px; }

        /* Photo Upload */
        .photo-upload-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            border: 2px dashed var(--border);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-muted);
            font-weight: 600;
            background: white;
            gap: 8px;
        }
        .photo-upload-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
        .btn-remove {
            background: #FEE2E2;
            color: #DC2626;
            border: none;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 8px;
            width: 100%;
        }

        /* Color Picker */
        .color-presets { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 12px; }
        .color-preset {
            width: 100%;
            aspect-ratio: 1;
            border: 2px solid white;
            border-radius: 50%;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }
        .color-preset:hover { transform: scale(1.15); box-shadow: var(--shadow-md); }

        /* Sidebar Footer */
        .sidebar-footer { margin-top: auto; padding-top: 20px; border-top: 1px solid var(--border); }
        .price-display {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 16px;
            background: white;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
        }
        .price-label { color: var(--text-muted); font-weight: 600; font-size: 0.9rem; }
        .price-value { font-size: 1.5rem; font-weight: 800; color: var(--primary); }

        /* ============================================
           5. ZONE DE PRÉVISUALISATION (LE CŒUR)
           ============================================ */
        .editor-preview {
            background: #e2e8f0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: calc(100vh - 65px);
            position: relative;
            overflow: hidden;
        }

        .preview-toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            background: white;
            padding: 8px 16px;
            border-radius: var(--radius-full);
            box-shadow: var(--shadow-md);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        #zoom-level {
            font-weight: 700;
            min-width: 50px;
            text-align: center;
            font-size: 0.9rem;
            color: var(--dark);
        }

        .preview-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
            overflow: auto;
            padding: 20px;
            -webkit-overflow-scrolling: touch;
        }

        .document-canvas {
            width: 210mm;
            min-height: 297mm;
            background: white;
            box-shadow: var(--shadow-lg);
            transform-origin: top center;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ============================================
           6. MODAL & OVERLAYS
           ============================================ */
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            z-index: 900;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .sidebar-overlay.active { display: block; opacity: 1; }

        .loading-overlay, .error-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.95);
            display: flex; align-items: center; justify-content: center;
            z-index: 9999;
        }
        .loading-content, .error-content { text-align: center; max-width: 400px; padding: 32px; background: white; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); }
        .spinner {
            width: 50px; height: 50px;
            border: 4px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(26, 26, 46, 0.8);
            backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center;
            z-index: 2000;
            padding: 16px;
        }
        .modal-content {
            background: white;
            padding: 32px;
            border-radius: var(--radius-lg);
            max-width: 480px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: var(--shadow-lg);
        }
        .modal-close {
            position: absolute; top: 16px; right: 16px;
            background: var(--bg-body); border: none;
            width: 36px; height: 36px; border-radius: 50%;
            font-size: 1rem; cursor: pointer; color: var(--text-muted);
            display: flex; align-items: center; justify-content: center;
            transition: var(--transition);
        }
        .modal-close:hover { background: #FEE2E2; color: #DC2626; transform: rotate(90deg); }

        .payment-amount { font-size: 2rem; font-weight: 800; color: var(--primary); text-align: center; margin: 16px 0; }
        .payment-methods { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0; }
        .payment-option { display: block; cursor: pointer; }
        .payment-option input { display: none; }
        .payment-badge-mtn, .payment-badge-airtel {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            text-align: center;
            font-weight: 700;
            transition: var(--transition);
            font-size: 0.85rem;
            background: white;
        }
        .payment-badge-mtn { color: #003399; }
        .payment-badge-airtel { color: #990000; }
        .payment-option input:checked + .payment-badge-mtn,
        .payment-option input:checked + .payment-badge-airtel {
            border-color: var(--primary);
            background: var(--primary-light);
            color: var(--primary-dark);
        }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 700; color: var(--dark); font-size: 0.9rem; }
        .form-group input {
            width: 100%; padding: 12px;
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            font-size: 1rem; background: white; transition: var(--transition);
        }
        .form-group input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255,107,53,0.1); }

        /* ============================================
           7. RESPONSIVE — DESKTOP + MOBILE BOTTOM SHEET
           ============================================ */
        .document-stage {
            position: relative;
            display: block;
            flex: 0 0 auto;
            margin: 0 auto;
        }

        .document-canvas {
            flex: 0 0 auto;
            width: 210mm;
            min-width: 210mm;
            max-width: none;
            min-height: 297mm;
            margin: 0;
            background: #fff;
            transform-origin: top left;
        }

        .preview-container {
            min-width: 0;
            min-height: 0;
            width: 100%;
            flex: 1 1 auto;
            padding: 12px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Le défilement n'est activé que si l'utilisateur zoome au-delà du cadre */
        .preview-container.is-zoomed {
            display: block;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
        }

        .mobile-edit-toggle {
            display: none;
        }

        @media (max-width: 1024px) and (min-width: 769px) {
            .editor-layout { grid-template-columns: 320px minmax(0, 1fr); }
            .editor-sidebar { padding: 20px; }
            .editor-preview { padding: 16px; }
        }

        @media (max-width: 768px) {
            html, body {
                width: 100%;
                min-height: 100%;
                overflow-x: hidden;
            }

            .editor-nav {
                position: sticky;
                top: 0;
                padding: 8px 12px;
                min-height: 60px;
            }

            .nav-container {
                display: flex;
                gap: 8px;
                min-width: 0;
            }

            .nav-left { gap: 8px; min-width: 0; }
            .logo { font-size: 1.25rem; }
            .sidebar-toggle { display: flex; width: 34px; height: 34px; font-size: 1rem; }
            .nav-back { display: none; }
            .editor-actions { gap: 6px; }
            .editor-actions .btn { width: 38px; height: 38px; padding: 0; }
            .editor-actions .btn span { display: none; }

            #editor-interface.editor-layout {
                display: flex !important;
                flex-direction: column;
                width: 100%;
                height: calc(100dvh - 60px);
                min-height: 0;
                overflow: hidden;
            }

            .editor-preview {
                order: 1;
                flex: 1 1 auto;
                width: 100%;
                height: auto;
                min-height: 0;
                padding: 8px 8px 76px;
                box-sizing: border-box;
                overflow: hidden;
                align-items: stretch;
                transition: height .25s ease, flex-basis .25s ease;
            }

            .preview-toolbar {
                flex: 0 0 auto;
                align-self: center;
                width: max-content;
                max-width: 100%;
                gap: 8px;
                padding: 5px 10px;
                margin: 0 auto 8px;
                position: relative;
                top: auto;
            }

            .btn-icon { width: 34px; height: 34px; font-size: .9rem; }
            #zoom-level { display: inline-block; min-width: 40px; font-size: .8rem; }

            .preview-container {
                flex: 1 1 auto;
                width: 100%;
                min-width: 0;
                min-height: 0;
                padding: 4px;
                justify-content: center;
                align-items: center;
                overflow: hidden;
            }

            .preview-container.is-zoomed {
                display: block;
                overflow: auto;
            }

            /* Le formulaire est un bottom sheet : masqué au départ */
            .editor-sidebar {
                position: fixed;
                top: auto;
                left: 0;
                right: 0;
                bottom: 0;
                z-index: 1200;
                width: 100%;
                max-width: none;
                height: 54dvh;
                max-height: 78dvh;
                padding: 22px 16px calc(18px + env(safe-area-inset-bottom));
                gap: 16px;
                border: 0;
                border-radius: 22px 22px 0 0;
                box-shadow: 0 -10px 36px rgba(15, 23, 42, .2);
                background: #fff;
                overflow-x: hidden;
                overflow-y: auto;
                overscroll-behavior: contain;
                -webkit-overflow-scrolling: touch;
                transform: translateY(105%);
                visibility: hidden;
                transition: transform .28s cubic-bezier(.2,.8,.2,1), visibility .28s ease;
                top: auto;
            }

            .editor-sidebar::before {
                content: "";
                display: block;
                width: 42px;
                height: 5px;
                min-height: 5px;
                margin: -10px auto 2px;
                border-radius: 99px;
                background: #d1d5db;
            }

            .editor-sidebar.open {
                left: 0;
                transform: translateY(0);
                visibility: visible;
            }

            .sidebar-header { flex: 0 0 auto; padding-bottom: 12px; }
            .sidebar-header h2 { font-size: 1.1rem; }
            .sidebar-section { padding: 14px; }
            .sidebar-footer { flex: 0 0 auto; margin-top: 0; padding-top: 14px; }
            .price-display { padding: 12px; margin-bottom: 12px; }
            .price-value { font-size: 1.2rem; }

            /* Overlay limité à la zone d'aperçu : la page reste visible en haut */
            .sidebar-overlay {
                display: block;
                position: fixed;
                top: 60px;
                left: 0;
                right: 0;
                bottom: 54dvh;
                z-index: 1100;
                background: rgba(15, 23, 42, .12);
                backdrop-filter: none;
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
                transition: opacity .25s ease, visibility .25s ease;
            }

            .sidebar-overlay.active {
                opacity: 1;
                visibility: visible;
                pointer-events: auto;
            }

            .mobile-edit-toggle {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
                position: fixed;
                left: 50%;
                bottom: calc(12px + env(safe-area-inset-bottom));
                transform: translateX(-50%);
                z-index: 1300;
                width: max-content;
                max-width: calc(100vw - 28px);
                padding: 13px 20px;
                border: 0;
                border-radius: 999px;
                background: var(--primary);
                color: #fff;
                box-shadow: 0 6px 22px rgba(255, 107, 53, .32);
                font: inherit;
                font-size: .9rem;
                font-weight: 800;
                cursor: pointer;
                white-space: nowrap;
                transition: bottom .25s ease, background .2s ease, transform .2s ease;
            }

            .mobile-edit-toggle:active { transform: translateX(-50%) scale(.98); }
            .mobile-edit-toggle .mobile-edit-chevron { transition: transform .25s ease; }
            .mobile-edit-toggle.active {
                bottom: calc(54dvh + 8px);
                background: var(--dark);
                box-shadow: var(--shadow-md);
            }
            .mobile-edit-toggle.active .mobile-edit-chevron { transform: rotate(180deg); }

            /* Quand le formulaire est ouvert, réserver la moitié supérieure à l'aperçu */
            body.mobile-sheet-open #editor-interface .editor-preview {
                flex: 0 0 calc(46dvh - 60px);
                height: calc(46dvh - 60px);
                min-height: 120px;
                padding-bottom: 8px;
            }

            body.mobile-sheet-open #editor-interface .preview-toolbar {
                margin-bottom: 4px;
                padding: 3px 8px;
            }

            body.mobile-sheet-open #editor-interface .btn-icon {
                width: 30px;
                height: 30px;
            }

            .payment-methods { grid-template-columns: 1fr; }
            .modal-content { padding: 24px; }
        }

        @media (max-width: 380px) {
            .editor-nav { padding-left: 8px; padding-right: 8px; }
            .logo { font-size: 1.12rem; }
            .editor-actions { gap: 4px; }
            .editor-actions .btn { width: 34px; height: 34px; }
            .mobile-edit-toggle { padding: 12px 16px; font-size: .84rem; }
            .editor-sidebar { padding-left: 12px; padding-right: 12px; }
        }

        @media (max-width: 768px) and (orientation: landscape) {
            .editor-sidebar { height: 68dvh; max-height: 82dvh; }
            .sidebar-overlay { bottom: 68dvh; }
            .mobile-edit-toggle.active { bottom: calc(68dvh + 8px); }
            body.mobile-sheet-open #editor-interface .editor-preview {
                flex-basis: calc(30dvh - 60px);
                height: calc(30dvh - 60px);
            }
        }

        @media (min-width: 769px) {
            .mobile-edit-toggle { display: none !important; }
            .sidebar-overlay { display: none !important; }
            .editor-sidebar {
                position: sticky;
                top: 65px;
                left: auto;
                bottom: auto;
                width: auto;
                max-width: none;
                height: calc(100vh - 65px);
                max-height: none;
                transform: none;
                visibility: visible;
                border-radius: 0;
                box-shadow: none;
            }
            .editor-sidebar::before { display: none; }
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav class="editor-nav">
        <div class="nav-container">
            <div class="nav-left">
                <button class="sidebar-toggle" id="sidebarToggle" aria-label="Menu"><i class="fas fa-bars"></i></button>
                <a href="index.html" class="logo">
                    <span class="logo-taki">Taki</span><span class="logo-doc">Doc</span>
                </a>
            </div>
            <div class="editor-actions">
                <a href="index.html" class="nav-back"><i class="fas fa-arrow-left"></i> <span>Accueil</span></a>
                <button id="btn-download" class="btn btn-secondary btn-sm"><i class="fas fa-download"></i> <span>Télécharger</span></button>
                <button id="btn-buy" class="btn btn-primary btn-sm"><i class="fas fa-shopping-cart"></i> <span>Acheter</span></button>
            </div>
        </div>
    </nav>

    <!-- Overlay Mobile -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Loading State -->
    <div id="editor-loading" class="loading-overlay">
        <div class="loading-content">
            <div class="spinner"></div>
            <p style="color: var(--text-muted); font-size: 1rem; font-weight: 600;">Chargement du document...</p>
        </div>
    </div>

    <!-- Error State -->
    <div id="editor-error" class="error-overlay" style="display: none;">
        <div class="error-content">
            <h2 style="color: var(--dark); margin-bottom: 12px;"><i class="fas fa-exclamation-triangle" style="color: var(--primary);"></i> Document introuvable</h2>
            <p style="color: var(--text-muted); margin-bottom: 24px;">Le document demandé n'existe pas ou n'est plus disponible.</p>
            <a href="index.html" class="btn btn-primary"><i class="fas fa-home"></i> Retour à l'accueil</a>
        </div>
    </div>

    <!-- Interface Éditeur -->
    <div id="editor-interface" class="editor-layout" style="display: none;">
        
        <!-- PANNEAU GAUCHE : Contrôles -->
        <aside class="editor-sidebar" id="editorSidebar">
            <div class="sidebar-header">
                <h2 id="doc-title">Personnalisation</h2>
                <span id="doc-category" class="category-badge">Catégorie</span>
            </div>

            <div id="photo-section" class="sidebar-section" style="display: none;">
                <h3><i class="fas fa-camera"></i> Photo de profil</h3>
                <div class="photo-upload">
                    <input type="file" id="photo-input" accept="image/*" hidden>
                    <label for="photo-input" class="photo-upload-btn">
                        <i class="fas fa-cloud-upload-alt"></i> <span id="photo-label">Ajouter une photo</span>
                    </label>
                    <button id="photo-remove" class="btn-remove" style="display: none;"><i class="fas fa-times"></i> Retirer</button>
                </div>
            </div>

            <div id="color-section" class="sidebar-section" style="display: none;">
                <h3><i class="fas fa-palette"></i> Couleur principale</h3>
                <input type="color" id="color-picker" value="#0F172A" style="width: 100%; height: 40px; border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; padding: 4px;">
                <div class="color-presets">
                    <button class="color-preset" data-color="#0F172A" style="background: #0F172A;"></button>
                    <button class="color-preset" data-color="#FF6B35" style="background: #FF6B35;"></button>
                    <button class="color-preset" data-color="#004E89" style="background: #004E89;"></button>
                    <button class="color-preset" data-color="#059669" style="background: #059669;"></button>
                    <button class="color-preset" data-color="#DC2626" style="background: #DC2626;"></button>
                    <button class="color-preset" data-color="#7C3AED" style="background: #7C3AED;"></button>
                </div>
            </div>

            <div id="fields-section" class="sidebar-section">
                <h3><i class="fas fa-edit"></i> Vos informations</h3>
                <div id="fields-container"></div>
            </div>

            <div class="sidebar-footer">
                <div class="price-display">
                    <span class="price-label">Prix total :</span>
                    <span id="doc-price" class="price-value">0 FCFA</span>
                </div>
                <button id="btn-buy-sidebar" class="btn btn-primary btn-full"><i class="fas fa-shopping-cart"></i> Acheter et télécharger</button>
            </div>
        </aside>

        <!-- PANNEAU DROIT : Aperçu -->
        <main class="editor-preview">
            <div class="preview-toolbar">
                <button id="btn-zoom-out" class="btn-icon" title="Réduire"><i class="fas fa-minus"></i></button>
                <span id="zoom-level">100%</span>
                <button id="btn-zoom-in" class="btn-icon" title="Agrandir"><i class="fas fa-plus"></i></button>
                <button id="btn-zoom-reset" class="btn-icon" title="Taille normale"><i class="fas fa-expand"></i></button>
            </div>
            <div class="preview-container" id="previewContainer">
                <div id="document-canvas" class="document-canvas"></div>
            </div>
        </main>
    </div>

    <!-- Bouton de personnalisation mobile : ouvre le panneau inférieur -->
    <button id="mobile-edit-toggle" class="mobile-edit-toggle" type="button"
            aria-controls="editorSidebar" aria-expanded="false">
        <i class="fas fa-sliders-h" aria-hidden="true"></i>
        <span>Modifier mon document</span>
        <i class="fas fa-chevron-up mobile-edit-chevron" aria-hidden="true"></i>
    </button>

    <!-- Modal de paiement -->
    <div id="payment-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <button class="modal-close" id="modal-close"><i class="fas fa-times"></i></button>
            <h2 style="color: var(--dark); font-size: 1.25rem; font-weight: 800; margin-bottom: 8px;"><i class="fas fa-lock" style="color: var(--primary);"></i> Finaliser l'achat</h2>
            <p id="payment-doc-name" style="color: var(--text-muted); font-size: 0.9rem;">Document</p>
            <div class="payment-amount" id="payment-amount">0 FCFA</div>
            
            <form id="payment-form">
                <div class="form-group">
                    <label>Mode de paiement</label>
                    <div class="payment-methods">
                        <label class="payment-option">
                            <input type="radio" name="payment_method" value="MTN_MOMO" checked>
                            <span class="payment-badge-mtn"><i class="fas fa-mobile-alt"></i> MTN MoMo</span>
                        </label>
                        <label class="payment-option">
                            <input type="radio" name="payment_method" value="AIRTEL_MONEY">
                            <span class="payment-badge-airtel"><i class="fas fa-mobile-alt"></i> Airtel Money</span>
                        </label>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="pay-phone">Numéro de téléphone *</label>
                    <input type="tel" id="pay-phone" placeholder="06 XX XX XX XX" required>
                </div>
                
                <div class="form-group">
                    <label for="pay-email">Email (pour le reçu) *</label>
                    <input type="email" id="pay-email" placeholder="votre@email.com" required>
                </div>
                
                <button type="submit" class="btn btn-primary btn-full"><i class="fas fa-check-circle"></i> Confirmer le paiement</button>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="js/supabase-config.js"></script>
    <script type="module" src="js/templates-registry.js"></script>
    <script type="module" src="js/editor.js"></script>
    
    <script>
        // Compatibilité photo : certains modèles exposent leur zone photo
        // dans le HTML rendu même si la métadonnée hasPhoto est absente.
        // Dans ce cas, on réactive le contrôle sans toucher à editor.js.
        (() => {
            const section = document.getElementById('photo-section');
            const canvas = document.getElementById('document-canvas');
            const input = document.getElementById('photo-input');
            const label = document.getElementById('photo-label');
            const removeButton = document.getElementById('photo-remove');
            if (!section || !canvas || !input || !label || !removeButton) return;

            let fallbackEnabled = false;
            let currentPhotoUrl = null;

            function getInitials() {
                const nameInput = document.getElementById('input-field-nom');
                const nameField = document.getElementById('field-nom');
                const name = (nameInput?.value || nameField?.textContent || '').trim();
                const words = name.split(/\s+/).filter(Boolean);
                if (words.length >= 2) return (words[0][0] + words[words.length - 1][0]).toUpperCase();
                return words.length ? words[0].slice(0, 2).toUpperCase() : 'TD';
            }

            function enablePhotoFallback() {
                const photo = canvas.querySelector('#doc-photo');
                if (!photo || section.style.display !== 'none' || fallbackEnabled) return;

                fallbackEnabled = true;
                section.style.display = 'block';

                input.addEventListener('change', () => {
                    const file = input.files && input.files[0];
                    if (!file) return;
                    if (!file.type.startsWith('image/')) {
                        input.value = '';
                        label.textContent = 'Choisir une image valide';
                        return;
                    }

                    const reader = new FileReader();
                    reader.onload = event => {
                        currentPhotoUrl = event.target.result;
                        const target = canvas.querySelector('#doc-photo');
                        if (!target) return;
                        target.innerHTML = '';
                        const image = document.createElement('img');
                        image.src = currentPhotoUrl;
                        image.alt = 'Photo de profil';
                        image.style.cssText = 'width:100%;height:100%;object-fit:cover;border-radius:50%;';
                        target.appendChild(image);
                        label.textContent = '✓ Photo ajoutée';
                        removeButton.style.display = 'block';
                    };
                    reader.readAsDataURL(file);
                });

                removeButton.addEventListener('click', () => {
                    currentPhotoUrl = null;
                    input.value = '';
                    const target = canvas.querySelector('#doc-photo');
                    if (target) {
                        target.innerHTML = '';
                        const initials = document.createElement('span');
                        initials.className = 'cv-photo-placeholder';
                        initials.textContent = getInitials();
                        initials.style.cssText = 'font-size:2rem;font-weight:700;color:white;';
                        target.appendChild(initials);
                    }
                    label.textContent = 'Ajouter une photo';
                    removeButton.style.display = 'none';
                });
            }

            const observer = new MutationObserver(enablePhotoFallback);
            observer.observe(canvas, { childList: true, subtree: true });
            enablePhotoFallback();
        })();
    </script>

    <script>
        // Panneau inférieur mobile. Le formulaire et ses champs restent les mêmes.
        (() => {
            const sidebarToggle = document.getElementById('sidebarToggle');
            const editorSidebar = document.getElementById('editorSidebar');
            const sidebarOverlay = document.getElementById('sidebarOverlay');
            const mobileEditToggle = document.getElementById('mobile-edit-toggle');
            const mobileQuery = window.matchMedia('(max-width: 768px)');

            if (!editorSidebar || !sidebarOverlay || !mobileEditToggle) return;

            function isMobile() {
                return mobileQuery.matches;
            }

            function setSheetOpen(open) {
                if (!isMobile()) {
                    editorSidebar.classList.remove('open');
                    sidebarOverlay.classList.remove('active');
                    mobileEditToggle.classList.remove('active');
                    document.body.classList.remove('mobile-sheet-open');
                    document.body.style.overflow = '';
                    mobileEditToggle.setAttribute('aria-expanded', 'false');
                    return;
                }

                editorSidebar.classList.toggle('open', open);
                sidebarOverlay.classList.toggle('active', open);
                mobileEditToggle.classList.toggle('active', open);
                document.body.classList.toggle('mobile-sheet-open', open);
                document.body.style.overflow = '';
                mobileEditToggle.setAttribute('aria-expanded', String(open));

                const label = mobileEditToggle.querySelector('span');
                if (label) label.textContent = open ? 'Fermer les modifications' : 'Modifier mon document';

                // Recalcule l'aperçu pour la nouvelle hauteur disponible.
                window.dispatchEvent(new Event('resize'));
            }

            function toggleSheet() {
                setSheetOpen(!editorSidebar.classList.contains('open'));
            }

            mobileEditToggle.addEventListener('click', toggleSheet);
            sidebarToggle?.addEventListener('click', () => {
                if (isMobile()) toggleSheet();
            });
            sidebarOverlay.addEventListener('click', () => setSheetOpen(false));

            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape' && editorSidebar.classList.contains('open')) {
                    setSheetOpen(false);
                }
            });

            mobileQuery.addEventListener?.('change', () => setSheetOpen(false));
            window.addEventListener('resize', () => {
                if (!isMobile()) setSheetOpen(false);
            });
        })();
    </script>
</body>
</html>
