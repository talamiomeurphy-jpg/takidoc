<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Éditeur - TakiDoc</title>
    <meta name="description" content="Personnalisez votre document professionnel">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        :root {
            --primary: #FF6B35;
            --primary-dark: #E85A2D;
            --primary-light: #FFF5F0;
            --dark: #0F172A;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --border: #E2E8F0;
            --border-light: #F1F5F9;
            --bg-body: #F8FAFC;
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.1);
            --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-full: 9999px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
        }

        /* ============================================
           HEADER À 2 LIGNES
           ============================================ */
        .editor-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            z-index: 1000;
            box-shadow: 0 2px 20px rgba(0,0,0,0.08);
        }

        .header-top {
            display: flex;
            align-items: center;
            padding: 12px 24px;
            gap: 20px;
            background: #FFFFFF;
            border-bottom: 1px solid rgba(226, 232, 240, 0.6);
        }

        .header-logo {
            font-size: 1.5rem;
            font-weight: 900;
            text-decoration: none;
            letter-spacing: -1px;
            flex-shrink: 0;
        }

        .header-logo .taki { color: var(--primary); }
        .header-logo .doc { color: var(--dark); }

        .header-search {
            flex: 1;
            max-width: 500px;
            position: relative;
        }

        .header-search input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-full);
            font-size: 0.9rem;
            font-family: inherit;
            transition: var(--transition);
            background: var(--bg-body);
        }

        .header-search input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255,107,53,0.1);
            background: white;
        }

        .header-search i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .header-auth {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: auto;
        }

        .header-bottom {
            display: flex;
            align-items: center;
            padding: 10px 24px;
            gap: 16px;
            background: #F8FAFC;
        }

        .document-name {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--dark);
            padding: 6px 14px;
            background: white;
            border-radius: var(--radius-full);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            flex-shrink: 0;
        }

        .document-name i {
            color: var(--primary);
            font-size: 0.85rem;
        }

        .document-name .doc-category {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: 500;
            margin-left: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .zoom-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            background: white;
            padding: 6px 12px;
            border-radius: var(--radius-full);
            border: 1px solid var(--border);
        }

        .zoom-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--bg-body);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            color: var(--text-main);
            font-size: 0.85rem;
        }

        .zoom-btn:hover {
            background: var(--primary);
            color: white;
        }

        .zoom-level {
            font-weight: 700;
            min-width: 50px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--dark);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: auto;
        }

        /* ============================================
           BOUTONS
           ============================================ */
        .btn {
            padding: 10px 20px;
            border-radius: var(--radius-full);
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
            transition: var(--transition);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(255,107,53,0.3);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: white;
            color: var(--dark);
            border: 1.5px solid var(--border);
        }

        .btn-secondary:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-muted);
            border: none;
        }

        .btn-ghost:hover {
            color: var(--dark);
            background: var(--bg-body);
        }

        /* ============================================
           ZONE DOCUMENT
           ============================================ */
        .document-area {
            position: fixed;
            top: 110px;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            overflow: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 60px;
        }

        .document-area::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                radial-gradient(circle, rgba(255,255,255,0.15) 1px, transparent 1px),
                radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 20px 20px, 40px 40px;
            background-position: 0 0, 10px 10px;
            pointer-events: none;
        }

        .document-wrapper {
            position: relative;
            z-index: 1;
            transform-origin: top center;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .document-canvas {
            width: 210mm;
            min-height: 297mm;
            background: white;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            border-radius: 8px;
        }

        /* ============================================
           SIDEBAR DE PERSONNALISATION
           ============================================ */
        .sidebar-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            z-index: 1001;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }

        .sidebar-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .customization-sidebar {
            position: fixed;
            top: 0;
            right: -420px;
            width: 420px;
            height: 100vh;
            background: white;
            box-shadow: var(--shadow-lg);
            z-index: 1002;
            transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .customization-sidebar.active {
            right: 0;
        }

        .sidebar-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .sidebar-header h2 {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--dark);
        }

        .sidebar-close {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--bg-body);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            color: var(--text-muted);
        }

        .sidebar-close:hover {
            background: #FEE2E2;
            color: #DC2626;
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        .sidebar-section {
            margin-bottom: 24px;
            padding: 20px;
            background: var(--bg-body);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
        }

        .sidebar-section h3 {
            font-size: 1rem;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-section h3 i {
            color: var(--primary);
        }

        .form-field {
            margin-bottom: 16px;
        }

        .form-field label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 600;
        }

        .form-field input,
        .form-field textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 0.9rem;
            transition: var(--transition);
            background: white;
        }

        .form-field input:focus,
        .form-field textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255,107,53,0.1);
        }

        .form-field textarea {
            resize: vertical;
            min-height: 80px;
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        #color-picker {
            width: 50px;
            height: 50px;
            border: 2px solid var(--border);
            border-radius: 50%;
            cursor: pointer;
            padding: 4px;
            background: white;
        }

        .color-presets {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
        }

        .color-preset {
            width: 100%;
            aspect-ratio: 1;
            border: 2px solid white;
            border-radius: 50%;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }

        .color-preset:hover { transform: scale(1.15); }
        .color-preset.active {
            border: 2px solid var(--dark);
            transform: scale(1.1);
        }

        .photo-upload-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            border: 2px dashed var(--border);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-muted);
            font-weight: 600;
            background: white;
            gap: 8px;
        }

        .photo-upload-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-light);
        }

        /* ============================================
           MODAL CONNEXION
           ============================================ */
        .login-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }

        .login-modal.active {
            opacity: 1;
            visibility: visible;
        }

        .login-modal-content {
            background: white;
            padding: 32px;
            border-radius: var(--radius-lg);
            max-width: 400px;
            width: 90%;
            box-shadow: var(--shadow-xl);
            text-align: center;
            transform: scale(0.9);
            transition: var(--transition);
        }

        .login-modal.active .login-modal-content {
            transform: scale(1);
        }

        .login-modal-content h3 {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--dark);
            margin-bottom: 12px;
        }

        .login-modal-content p {
            color: var(--text-muted);
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .login-modal-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .login-modal-actions .btn { flex: 1; }

        /* ============================================
           ÉDITION DIRECTE
           ============================================ */
        .direct-editable {
            cursor: text !important;
            border: 1.5px dashed transparent;
            border-radius: 4px;
            transition: all 0.2s ease;
            outline: none;
            position: relative;
            background-color: transparent !important;
            color: inherit !important;
        }

        .direct-editable:hover {
            border-color: var(--primary);
            background-color: rgba(255, 107, 53, 0.08) !important;
        }

        .direct-editable:focus {
            border-color: var(--primary);
            background-color: rgba(255, 255, 255, 0.15) !important;
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.2);
            color: inherit !important;
        }

        .direct-editable.on-dark-bg {
            color: white !important;
        }

        .direct-editable.on-dark-bg:focus {
            background-color: rgba(0, 0, 0, 0.3) !important;
            border-color: #FF8E53;
        }

        .takidoc-footer-protected {
            contentEditable: false !important;
            user-select: none !important;
            pointer-events: none !important;
            opacity: 0.5;
        }

        /* Toast */
        .editor-toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--dark);
            color: white;
            padding: 14px 24px;
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            font-weight: 500;
            box-shadow: var(--shadow-lg);
            z-index: 9999;
            opacity: 0;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .editor-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ============================================
           BOUTONS FLOTTANTS MOBILE
           ============================================ */
        .mobile-fab-container {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
            background: linear-gradient(to top, rgba(255,255,255,0.98) 0%, rgba(255,255,255,0.9) 80%, transparent 100%);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 9999;
            justify-content: space-between;
            gap: 12px;
            pointer-events: auto;
        }

        .mobile-fab {
            flex: 1;
            padding: 14px 20px;
            border-radius: var(--radius-full);
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            pointer-events: auto;
            position: relative;
            z-index: 10000;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            touch-action: manipulation;
        }

        .mobile-fab:active {
            transform: scale(0.95);
        }

        .mobile-fab-customize {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 16px rgba(255,107,53,0.4);
        }

        .mobile-fab-customize:hover {
            background: var(--primary-dark);
            box-shadow: 0 6px 20px rgba(255,107,53,0.5);
            transform: translateY(-2px);
        }

        .mobile-fab-download {
            background: white;
            color: var(--dark);
            border: 2px solid var(--border);
        }

        .mobile-fab-download:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
        }

        /* ============================================
           RESPONSIVE MOBILE
           ============================================ */
        @media (max-width: 768px) {
            .header-top {
                padding: 6px 10px;
                height: 40px;
            }

            .header-logo {
                font-size: 1rem;
                letter-spacing: -0.5px;
            }

            .header-search {
                display: none;
            }

            .header-auth {
                gap: 4px;
            }

            .header-auth .btn {
                padding: 5px 8px;
                font-size: 0.7rem;
            }

            .header-auth .btn span {
                display: none;
            }

            .header-bottom {
                padding: 6px 10px;
                gap: 8px;
                height: 42px;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }

            .document-name {
                flex: 1;
                font-size: 0.75rem;
                padding: 4px 10px;
                order: -1;
                width: 100%;
                justify-content: center;
            }

            .document-name .doc-category {
                display: none;
            }

            .zoom-controls {
                padding: 4px 8px;
                gap: 4px;
                flex-shrink: 0;
            }

            .zoom-btn {
                width: 26px;
                height: 26px;
                font-size: 0.7rem;
            }

            .zoom-level {
                min-width: 34px;
                font-size: 0.75rem;
            }

            .header-actions {
                display: none !important;
            }

            .mobile-fab-container {
                display: flex !important;
            }

            .document-area {
                top: 82px;
                bottom: 80px;
                padding: 10px 6px;
            }

            .customization-sidebar {
                width: 100%;
                right: -100%;
            }
        }

        @media (max-width: 360px) {
            .header-top {
                padding: 5px 8px;
                height: 36px;
            }

            .header-bottom {
                padding: 4px 8px;
                height: 38px;
            }

            .document-area {
                top: 74px;
                bottom: 76px;
            }

            .header-logo {
                font-size: 0.9rem;
            }

            .document-name {
                font-size: 0.7rem;
                padding: 3px 8px;
            }

            .zoom-btn {
                width: 24px;
                height: 24px;
            }

            .zoom-level {
                min-width: 30px;
                font-size: 0.65rem;
            }

            .mobile-fab {
                padding: 12px 16px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="editor-header">
        <div class="header-top">
            <a href="index.html" class="header-logo">
                <span class="taki">Taki</span><span class="doc">Doc</span>
            </a>
            
            <form class="header-search" id="searchForm">
                <i class="fas fa-search"></i>
                <input type="text" id="headerSearch" placeholder="Rechercher un document..." autocomplete="off">
            </form>
            
            <div class="header-auth" id="headerAuth">
                <!-- Injecté dynamiquement -->
            </div>
        </div>

        <div class="header-bottom">
            <div class="document-name" id="documentName">
                <i class="fas fa-file-alt"></i>
                <span id="docNameText">Chargement...</span>
                <span class="doc-category" id="docCategoryText"></span>
            </div>

            <div class="zoom-controls">
                <button class="zoom-btn" id="btn-zoom-out" title="Réduire">
                    <i class="fas fa-minus"></i>
                </button>
                <span class="zoom-level" id="zoom-level">95%</span>
                <button class="zoom-btn" id="btn-zoom-in" title="Agrandir">
                    <i class="fas fa-plus"></i>
                </button>
                <button class="zoom-btn" id="btn-zoom-reset" title="Taille normale">
                    <i class="fas fa-expand"></i>
                </button>
            </div>

            <div class="header-actions">
                <button class="btn btn-secondary" id="btn-download">
                    <i class="fas fa-download"></i>
                    <span>Télécharger</span>
                </button>
                <button class="btn btn-primary" id="btn-customize">
                    <i class="fas fa-sliders-h"></i>
                    <span>Personnaliser</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Zone Document -->
    <div class="document-area" id="documentArea">
        <div class="document-wrapper" id="documentWrapper">
            <div id="document-canvas" class="document-canvas"></div>
        </div>
    </div>

    <!-- Overlay Sidebar -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Sidebar de Personnalisation -->
    <aside class="customization-sidebar" id="customizationSidebar">
        <div class="sidebar-header">
            <h2>Personnalisation</h2>
            <button class="sidebar-close" id="sidebarClose">
                <i class="fas fa-times"></i>
            </button>
        </div>
        
        <div class="sidebar-content">
            <div class="sidebar-section" id="photo-section" style="display: none;">
                <h3><i class="fas fa-camera"></i> Photo de profil</h3>
                <input type="file" id="photo-input" accept="image/*" hidden>
                <label for="photo-input" class="photo-upload-btn">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <span id="photo-label">Ajouter une photo</span>
                </label>
                <button id="photo-remove" class="btn btn-secondary" style="display: none; margin-top: 8px; width: 100%;">
                    <i class="fas fa-times"></i> Retirer
                </button>
            </div>

            <div class="sidebar-section" id="color-section" style="display: none;">
                <h3><i class="fas fa-palette"></i> Couleur principale</h3>
                <div class="color-picker-wrapper">
                    <input type="color" id="color-picker" value="#0F172A">
                    <span id="color-hex" style="font-family: monospace; font-size: 0.9rem;">#0F172A</span>
                </div>
                <div class="color-presets">
                    <button class="color-preset" data-color="#0F172A" style="background: #0F172A;"></button>
                    <button class="color-preset" data-color="#FF6B35" style="background: #FF6B35;"></button>
