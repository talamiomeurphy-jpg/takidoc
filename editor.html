<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Éditeur - TakiDoc</title>
    <meta name="description" content="Personnalisez votre document professionnel">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/editor.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- html2pdf pour la génération PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

    <!-- Navigation simplifiée -->
    <nav class="navbar editor-nav">
        <div class="container nav-container">
            <a href="index.html" class="logo">Taki<span>Doc</span></a>
            <div class="editor-actions">
                <button id="btn-preview" class="btn btn-secondary btn-sm">👁️ Aperçu</button>
                <button id="btn-download" class="btn btn-primary btn-sm">⬇️ Télécharger PDF</button>
            </div>
        </div>
    </nav>

    <!-- Loading State -->
    <div id="editor-loading" class="loading-overlay">
        <div class="loading-content">
            <div class="spinner"></div>
            <p>Chargement du document...</p>
        </div>
    </div>

    <!-- Erreur -->
    <div id="editor-error" class="error-overlay" style="display: none;">
        <div class="error-content">
            <h2>Document introuvable</h2>
            <p>Le document demandé n'existe pas ou n'est plus disponible.</p>
            <a href="index.html" class="btn btn-primary">Retour à l'accueil</a>
        </div>
    </div>

    <!-- Interface de l'éditeur -->
    <div id="editor-interface" class="editor-layout" style="display: none;">
        
        <!-- PANNEAU GAUCHE : Contrôles de personnalisation -->
        <aside class="editor-sidebar">
            <div class="sidebar-header">
                <h2 id="doc-title">Personnalisation</h2>
                <p id="doc-category" class="category-badge">Catégorie</p>
            </div>

            <!-- Section Photo (si applicable) -->
            <div id="photo-section" class="sidebar-section" style="display: none;">
                <h3>📷 Photo de profil</h3>
                <div class="photo-upload">
                    <input type="file" id="photo-input" accept="image/*" hidden>
                    <label for="photo-input" class="photo-upload-btn">
                        <span id="photo-label">+ Ajouter une photo</span>
                    </label>
                    <button id="photo-remove" class="btn-remove" style="display: none;">✕ Retirer</button>
                </div>
            </div>

            <!-- Section Couleur (si applicable) -->
            <div id="color-section" class="sidebar-section" style="display: none;">
                <h3> Couleur principale</h3>
                <div class="color-picker-wrapper">
                    <input type="color" id="color-picker" value="#0F172A">
                    <div class="color-presets">
                        <button class="color-preset" data-color="#0F172A" style="background: #0F172A;"></button>
                        <button class="color-preset" data-color="#D97706" style="background: #D97706;"></button>
                        <button class="color-preset" data-color="#059669" style="background: #059669;"></button>
                        <button class="color-preset" data-color="#DC2626" style="background: #DC2626;"></button>
                        <button class="color-preset" data-color="#2563EB" style="background: #2563EB;"></button>
                        <button class="color-preset" data-color="#7C3AED" style="background: #7C3AED;"></button>
                    </div>
                </div>
            </div>

            <!-- Section Champs de texte -->
            <div id="fields-section" class="sidebar-section">
                <h3>✏️ Vos informations</h3>
                <div id="fields-container">
                    <!-- Les champs seront injectés dynamiquement par JS -->
                </div>
            </div>

            <!-- Prix et achat -->
            <div class="sidebar-footer">
                <div class="price-display">
                    <span class="price-label">Prix :</span>
                    <span id="doc-price" class="price-value">0 FCFA</span>
                </div>
                <button id="btn-buy" class="btn btn-primary btn-full">💳 Acheter et télécharger</button>
            </div>
        </aside>

        <!-- PANNEAU DROIT : Aperçu du document -->
        <main class="editor-preview">
            <div class="preview-toolbar">
                <button id="btn-zoom-out" class="btn-icon">−</button>
                <span id="zoom-level">100%</span>
                <button id="btn-zoom-in" class="btn-icon">+</button>
            </div>
            <div class="preview-container">
                <div id="document-canvas" class="document-canvas">
                    <!-- Le document sera injecté ici par JS -->
                </div>
            </div>
        </main>
    </div>

    <!-- Modal de paiement -->
    <div id="payment-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <button class="modal-close" id="modal-close">✕</button>
            <h2>Finaliser votre achat</h2>
            <p id="payment-doc-name">Document</p>
            <div class="payment-amount" id="payment-amount">0 FCFA</div>
            
            <form id="payment-form">
                <div class="form-group">
                    <label>Mode de paiement</label>
                    <div class="payment-methods">
                        <label class="payment-option">
                            <input type="radio" name="payment_method" value="MTN_MOMO" checked>
                            <span class="payment-badge-mtn">MTN MoMo</span>
                        </label>
                        <label class="payment-option">
                            <input type="radio" name="payment_method" value="AIRTEL_MONEY">
                            <span class="payment-badge-airtel">Airtel Money</span>
                        </label>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="pay-phone">Numéro de téléphone</label>
                    <input type="tel" id="pay-phone" placeholder="06 00 00 00" required>
                </div>
                
                <div class="form-group">
                    <label for="pay-email">Email (pour le reçu)</label>
                    <input type="email" id="pay-email" placeholder="votre@email.com" required>
                </div>
                
                <button type="submit" class="btn btn-primary btn-full">Confirmer le paiement</button>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="js/supabase-config.js"></script>
    <script type="module" src="js/templates-registry.js"></script>
    <script type="module" src="js/editor.js"></script>
</body>
</html>
