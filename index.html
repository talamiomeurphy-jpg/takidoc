<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="TakiDoc : la bibliothèque de documents professionnels au Congo. CV, lettres, contrats, factures, devis, attestations. Choisissez un modèle et personnalisez-le.">

<meta name="color-scheme" content="light">
<meta property="og:type" content="website">
<meta property="og:title" content="TakiDoc — Documents professionnels">
<meta property="og:description" content="Découvrez des modèles de CV, contrats, factures, devis et autres documents professionnels à personnaliser.">
<meta property="og:image" content="https://takidoc.onrender.com/android-chrome-512x512.png">
<meta name="twitter:card" content="summary">

<title>TakiDoc — Documents professionnels prêts à personnaliser</title>
<link rel="icon" href="favicon-32x32.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>

:root {
  --night: #0F172A;
  --or: #FF6B35;
  --ink: #E85A2D;
  --bg: #F5F6FA;
  --line: #E5E9F1;
  --mut: #647089;
  --ok: #0F8A5F;
  --hh: 68px;
  --ch: 56px;
  --ps: .3;
  --f: 'Figtree', system-ui, sans-serif;
  --d: 'Bricolage Grotesque', 'Figtree', system-ui, sans-serif;

  --bg: #F8F7F5;
--line: #E5E7EB;

  --surface: #FFFFFF;
  --surface-soft: #F8F9FC;
  --shadow-sm: 0 2px 8px rgba(15, 23, 42, .035);
  --shadow-card: 0 5px 18px rgba(15, 23, 42, .055);
  --shadow-hover: 0 18px 38px rgba(15, 23, 42, .12);
  --radius: 18px;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  scroll-padding-top: 140px;
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--night);
  font: 15px/1.55 var(--f);
  padding-bottom: 40px;
  overflow-x: clip;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

a {
  color: inherit;
  text-decoration: none;
}

button,
input,
select {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  border: 0;
  background: none;
  padding: 0;
}

button,
a,
input,
select {
  -webkit-tap-highlight-color: transparent;
}

:focus-visible {
  outline: 3px solid rgba(255, 107, 53, .65);
  outline-offset: 3px;
}

[hidden] {
  display: none !important;
}

::selection {
  background: rgba(255, 107, 53, .18);
  color: var(--night);
}

.wrap {
  width: min(1760px, 100%);
  margin-inline: auto;
  padding-inline: 28px;
}

/* =========================================
   NAVIGATION DES CATÉGORIES
   ========================================= */

.chips {
  position: sticky;
  top: 68px;
  left: auto;
  right: auto;
  z-index: 40;
  height: var(--ch);
  background: rgba(245, 246, 250, .92);
  border-bottom: 1px solid rgba(229, 233, 241, .8);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  transform: none;
  opacity: 1;
  pointer-events: auto;
  transition: background .2s, box-shadow .2s;
}

.rail {
  height: 100%;
  display: flex;
  align-items: center;
  gap: 9px;
  overflow-x: auto;
  overscroll-behavior-x: contain;
  scrollbar-width: none;
  scroll-snap-type: x proximity;
}

.rail::-webkit-scrollbar {
  display: none;
}

.c {
  position: relative;
  flex: 0 0 auto;
  height: 38px;
  padding: 0 16px;
  border-radius: 999px;
  background: rgba(255, 255, 255, .9);
  border: 1px solid #E3E7EF;
  color: #46516A;
  font-size: 13px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  white-space: nowrap;
  scroll-snap-align: start;
  transition:
    background .18s ease,
    color .18s ease,
    border-color .18s ease,
    transform .18s ease,
    box-shadow .18s ease;
}

.c i {
  font-size: 12px;
  color: var(--or);
  transition: color .18s;
}

.c small {
  color: #8B95A9;
  font-size: 11px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.c:hover {
  border-color: rgba(255, 107, 53, .5);
  background: #FFF9F6;
  color: var(--night);
  transform: translateY(-1px);
}

.c.on {
  background: var(--night);
  color: #fff;
  border-color: var(--night);
  box-shadow: 0 4px 12px rgba(15, 23, 42, .13);
}

.c.on i {
  color: #FF956D;
}

.c.on small {
  color: rgba(255, 255, 255, .75);
}

/* =========================================
   CONTENU PRINCIPAL
   ========================================= */

main {
  padding-top: 0;
  min-height: 65vh;
}

.intro {
  position: relative;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 32px;
  padding-top: 44px;
  padding-bottom: 25px;
}

.intro > div {
  min-width: 0;
}

.intro h1 {
  max-width: 790px;
  margin: 0;
  color: var(--night);
  font: 800 clamp(30px, 3.3vw, 46px)/1.1 var(--d);
  letter-spacing: -.045em;
  text-wrap: balance;
}

.intro p {
  max-width: 650px;
  margin: 15px 0 0;
  color: #69758C;
  font-size: 15.5px;
  line-height: 1.75;
}

.intro a {
  position: relative;
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 11px 0;
  color: #D94F1C;
  font-weight: 800;
  font-size: 14px;
  white-space: nowrap;
  transition: color .2s, gap .2s;
}

.intro a::after {
  content: "\f061";
  font-family: "Font Awesome 6 Free";
  font-weight: 900;
  font-size: 12px;
  transition: transform .2s;
}

.intro a:hover {
  color: #A93913;
  gap: 13px;
}

.intro a:hover::after {
  transform: translateX(2px);
}

/* =========================================
   COMPTEUR ET TRI
   ========================================= */

.tb {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding-top: 7px;
  padding-bottom: 17px;
  color: var(--mut);
  font-size: 13px;
}

#count {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  font-weight: 700;
  letter-spacing: .005em;
}

#sort {
  min-width: 176px;
  max-width: 220px;
  height: 40px;
  padding: 0 36px 0 14px;
  border: 1px solid #E1E6EF;
  border-radius: 12px;
  background-color: #fff;
  color: #39445D;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: border-color .2s, box-shadow .2s;
}

#sort:hover {
  border-color: #C9D0DE;
}

#sort:focus {
  border-color: var(--or);
  box-shadow: 0 0 0 4px rgba(255, 107, 53, .1);
  outline: none;
}

/* =========================================
   GRILLE MASONRY
   Les classes .col et .pin sont conservées.
   ========================================= */

#grid {
  display: flex;
  align-items: flex-start;
  gap: 19px;
  width: min(1760px, 100%);
  margin: 0 auto;
  padding: 0 28px;
}

.col {
  flex: 1 1 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 23px;
}

.pin {
  min-width: 0;
  content-visibility: auto;
  contain-intrinsic-size: auto 400px;
  animation: tdCardEnter .32s ease both;
}

@keyframes tdCardEnter {
  from {
    opacity: .65;
    transform: translateY(7px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* =========================================
   APERÇUS DES DOCUMENTS
   ========================================= */

.media {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  border-radius: 17px;
  background: #fff;
  box-shadow:
    0 1px 2px rgba(15, 23, 42, .045),
    0 6px 18px rgba(15, 23, 42, .055);
  transform: translateZ(0);
  transition:
    transform .26s cubic-bezier(.2, .7, .2, 1),
    box-shadow .26s ease;
}

.media::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  border: 1px solid rgba(15, 23, 42, .045);
  border-radius: inherit;
}

.sheet {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background: #fff;
}

.sheet iframe {
  position: absolute;
  top: 0;
  left: 0;
  width: 794px;
  height: 1123px;
  border: 0;
  transform-origin: 0 0;
  transform: scale(var(--ps));
  pointer-events: none;
  background: #fff;
}

.sheet img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top center;
}

.ph {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  color: #AAB4C7;
  font-size: 30px;
  background:
    linear-gradient(
      100deg,
      #F8F9FC 25%,
      #EEF1F7 45%,
      #FFFFFF 60%,
      #F8F9FC 80%
    ) 0 0 / 250% 100%;
  animation: tdShimmer 1.8s linear infinite;
}

.ph i {
  filter: drop-shadow(0 4px 8px rgba(15, 23, 42, .07));
}

.ready .ph {
  display: none;
}

@keyframes tdShimmer {
  to {
    background-position: -250% 0;
  }
}

.media > .open {
  position: absolute;
  inset: 0;
  z-index: 1;
  border-radius: inherit;
}

.media > .open:focus-visible {
  outline-offset: -4px;
}

/* =========================================
   ACTIONS SUR LES CARTES
   ========================================= */

.ic {
  flex: 0 0 auto;
  width: 38px;
  height: 38px;
  display: inline-grid;
  place-items: center;
  border-radius: 50%;
  background: #fff;
  color: var(--night);
  box-shadow: 0 3px 10px rgba(15, 23, 42, .12);
  font-size: 14px;
  transition:
    color .18s,
    background .18s,
    transform .18s,
    box-shadow .18s;
}

.ic:hover {
  color: var(--or);
  transform: scale(1.06);
  box-shadow: 0 5px 14px rgba(15, 23, 42, .16);
}

.fav {
  position: absolute;
  top: 12px;
  right: 12px;
  z-index: 3;
  opacity: 0;
  transform: translateY(-3px);
  transition: opacity .18s, transform .18s, background .18s;
}

.pin:hover .fav,
.pin:focus-within .fav,
.fav.on {
  opacity: 1;
  transform: translateY(0);
}

.fav.on {
  color: #fff;
  background: var(--or);
}

.fav.on:hover {
  color: #fff;
  background: #E85A27;
}

.hov {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 3;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 54px 12px 12px;
  background: linear-gradient(
    180deg,
    transparent 0%,
    rgba(15, 23, 42, .15) 28%,
    rgba(15, 23, 42, .72) 100%
  );
  opacity: 0;
  transition: opacity .2s ease;
  pointer-events: none;
}

.hov > * {
  pointer-events: auto;
}

.pin:hover .hov,
.pin:focus-within .hov {
  opacity: 1;
}

.go {
  flex: 1;
  min-width: 0;
  height: 41px;
  padding: 0 12px;
  border-radius: 12px;
  background: var(--or);
  color: #fff;
  font-size: 13px;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  box-shadow: 0 4px 12px rgba(232, 90, 39, .24);
  transition: background .18s, transform .18s;
}

.go:hover {
  background: #E85A27;
  transform: translateY(-1px);
}

.go:active {
  transform: translateY(0);
}

/* =========================================
   INFORMATIONS DES CARTES
   ========================================= */

.info {
  padding: 12px 3px 0;
}

.info h3 {
  margin: 0;
  color: #17213A;
  font: 700 14px/1.5 var(--f);
  letter-spacing: -.01em;
  height: 3em;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow-wrap: anywhere;
}

.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-height: 32px;
  padding-top: 4px;
}

.row b {
  color: #D94F1C;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: -.01em;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.row b.free {
  color: var(--ok);
}

.row small {
  min-width: 0;
  overflow: hidden;
  color: #7C879C;
  font-size: 11.5px;
  font-weight: 600;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.mini {
  display: none;
  align-items: center;
  gap: 3px;
}

.mini .ic {
  width: 32px;
  height: 32px;
  background: transparent;
  color: #68748A;
  box-shadow: none;
}

.mini .ic:last-child {
  color: var(--or);
}

.mini .ic:hover {
  background: #FFF0E9;
}

/* =========================================
   ÉTATS : CHARGEMENT, ERREUR, VIDE
   ========================================= */

.msg {
  max-width: 650px;
  margin: 44px auto;
  padding: 55px 28px;
  text-align: center;
  color: var(--mut);
  background: rgba(255, 255, 255, .8);
  border: 1px solid var(--line);
  border-radius: 22px;
  box-shadow: var(--shadow-sm);
}

.msg > i {
  color: var(--or);
  font-size: 34px;
}

.msg h2 {
  margin: 17px 0 7px;
  color: var(--night);
  font: 800 23px/1.25 var(--d);
  letter-spacing: -.025em;
}

.msg p {
  max-width: 420px;
  margin: 0 auto;
  color: var(--mut);
  font-size: 14px;
  line-height: 1.75;
}

.msg .bt {
  margin-top: 22px;
  background: var(--night);
  color: #fff;
  border-radius: 12px;
}

.msg .bt:hover {
  background: #24334F;
}

#sent {
  height: 100px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
}

#sent span {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--or);
  animation: tdBounce 1s infinite;
}

#sent span:nth-child(2) {
  animation-delay: .15s;
}

#sent span:nth-child(3) {
  animation-delay: .3s;
}

@keyframes tdBounce {
  0%, 70%, 100% {
    transform: translateY(0);
    opacity: .4;
  }
  35% {
    transform: translateY(-6px);
    opacity: 1;
  }
}

.end {
  padding: 34px 16px 24px;
  color: var(--mut);
  font-size: 13px;
  text-align: center;
}

/* =========================================
   PIED DE PAGE DESKTOP
   ========================================= */

.ft {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 60;
  height: 42px;
  background: rgba(255, 255, 255, .96);
  border-top: 1px solid rgba(229, 233, 241, .95);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  color: #718098;
  font-size: 12px;
}

.ft .wrap {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
}

.ft strong {
  color: var(--night);
  font-weight: 800;
}

.ft nav {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: clamp(12px, 1.5vw, 23px);
  flex-wrap: wrap;
}

.ft a {
  white-space: nowrap;
  transition: color .18s;
}

.ft a:hover {
  color: #D94F1C;
}

.tab {
  display: none;
}

/* =========================================
   NOTIFICATIONS
   ========================================= */

.toast {
  position: fixed;
  left: 50%;
  bottom: 60px;
  z-index: 90;
  width: max-content;
  max-width: calc(100vw - 32px);
  padding: 13px 18px;
  border: 1px solid rgba(255, 255, 255, .12);
  border-radius: 14px;
  background: #17213A;
  color: #fff;
  font-size: 13px;
  font-weight: 700;
  line-height: 1.5;
  box-shadow: 0 12px 35px rgba(15, 23, 42, .2);
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, 12px);
  transition: opacity .22s, transform .22s;
}

.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

.toast.err {
  background: #A52638;
}

/* =========================================
   TABLETTES
   ========================================= */

@media (max-width: 1180px) {
  .nav {
    display: none;
  }

  .wrap {
    padding-inline: 22px;
  }

  #grid {
    padding-inline: 22px;
    gap: 15px;
  }

  .col {
    gap: 19px;
  }

  .intro {
    padding-top: 34px;
  }

  .intro h1 {
    font-size: clamp(29px, 3.7vw, 40px);
  }

  .ft nav {
    gap: 13px;
  }
}

/* =========================================
   MOBILE : NAVIGATION ET PIED DE PAGE
   ========================================= */

@media (max-width: 900px) {
  body {
    padding-bottom: calc(64px + env(safe-area-inset-bottom));
  }

  .ft {
    height: auto;
    bottom: calc(62px + env(safe-area-inset-bottom));
    padding: 18px 0;
    border: 1px solid var(--line);
    border-radius: 20px 20px 0 0;
    box-shadow: 0 -10px 35px rgba(15, 23, 42, .08);
    transform: translateY(120%);
    transition: transform .28s ease;
  }

  .ft.open {
    transform: translateY(0);
  }

  .ft .wrap {
    flex-direction: column;
    align-items: flex-start;
    gap: 17px;
  }

  .ft nav {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px 18px;
    width: 100%;
    font-size: 13px;
  }

  .ft nav a {
    white-space: normal;
  }

  .tab {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 70;
    height: calc(62px + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom);
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    background: rgba(255, 255, 255, .97);
    border-top: 1px solid var(--line);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }

  .tab button {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    color: #77839A;
    font-size: 10.5px;
    font-weight: 700;
    transition: color .18s;
  }

  .tab button i {
    font-size: 18px;
    transition: transform .18s;
  }

  .tab button.on {
    color: #D94F1C;
  }

  .tab button.on i {
    transform: translateY(-1px);
  }

  .toast {
    bottom: calc(76px + env(safe-area-inset-bottom));
  }

  .msg {
    margin-inline: 20px;
  }
}

/* =========================================
   PETITS ÉCRANS
   ========================================= */

@media (max-width: 640px) {
  :root {
    --hh: 112px;
    --ch: 52px;
  }

  .wrap {
    padding-inline: 15px;
  }

  .chips {
    top: 63px;
    height: var(--ch);
  }

  .rail {
    gap: 7px;
  }

  .c {
    height: 35px;
    padding-inline: 13px;
    font-size: 12px;
    gap: 6px;
  }

  .c small {
    font-size: 10px;
  }

  #grid {
    padding-inline: 12px;
    gap: 10px;
  }

  .col {
    gap: 15px;
  }

  .intro {
    padding-top: 25px;
    padding-bottom: 16px;
    gap: 10px;
  }

  .intro h1 {
    max-width: 20ch;
    font-size: clamp(27px, 7.1vw, 35px);
    line-height: 1.12;
    letter-spacing: -.04em;
  }

  .intro p {
    max-width: 42ch;
    margin-top: 10px;
    font-size: 13px;
    line-height: 1.7;
  }

  .intro a {
    display: none;
  }

  .tb {
    padding-top: 5px;
    padding-bottom: 13px;
    gap: 8px;
    font-size: 12px;
  }

  #sort {
    min-width: 0;
    max-width: 175px;
    width: auto;
    height: 36px;
    padding-left: 10px;
    padding-right: 27px;
    font-size: 11px;
    border-radius: 10px;
  }

  .media {
    border-radius: 12px;
  }

  .info {
    padding-top: 8px;
  }

  .info h3 {
    font-size: 12px;
    line-height: 1.45;
    height: 2.9em;
  }

  .row {
    min-height: 29px;
    gap: 4px;
    padding-top: 3px;
  }

  .row b {
    font-size: 11px;
  }

  .row small {

/* Hero principal */

/* =========================================
   APERÇUS DES DOCUMENTS — FINITION PREMIUM
   ========================================= */

.media {
  position: relative;
  isolation: isolate;
  overflow: hidden;

  /* Le document se détache clairement du fond */
  border: 1px solid #DCE2EC;
  border-radius: 17px;
  background: #FFFFFF;

  /* Double profondeur : contour + ombre naturelle */
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.95),
    0 2px 5px rgba(15, 23, 42, 0.045),
    0 9px 22px rgba(15, 23, 42, 0.065);

  transform: translateZ(0);

  transition:
    border-color 0.25s ease,
    box-shadow 0.25s ease,
    transform 0.25s cubic-bezier(.2, .7, .2, 1);
}

/* Contour intérieur très léger */
.media::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;

  border: 1px solid rgba(15, 23, 42, 0.035);
  border-radius: inherit;
}

/* Mise en valeur au passage de la souris */
.pin:hover .media {
  border-color: rgba(255, 107, 53, 0.65);

  box-shadow:
    0 0 0 2px rgba(255, 107, 53, 0.07),
    0 5px 12px rgba(15, 23, 42, 0.055),
    0 18px 36px rgba(15, 23, 42, 0.12);

  transform: translateY(-3px);
}

/* Focus clavier accessible */
.pin:focus-within .media {
  border-color: #FF6B35;

  box-shadow:
    0 0 0 3px rgba(255, 107, 53, 0.14),
    0 10px 25px rgba(15, 23, 42, 0.09);
}

/* Les images et les aperçus gardent leurs dimensions */
.sheet {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background: #FFFFFF;
}

.sheet iframe {
  background: #FFFFFF;
}

.sheet img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top center;
}

/* Évite les déplacements sur les écrans tactiles */
@media (hover: none) {
  .pin:hover .media {
    transform: none;
    border-color: #DCE2EC;

    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.95),
      0 2px 5px rgba(15, 23, 42, 0.045),
      0 9px 22px rgba(15, 23, 42, 0.065);
  }
}
.brand-name {
  display: inline-flex;
  align-items: baseline;
  gap: 0;
  white-space: nowrap;
  letter-spacing: -0.7px;
}

.brand-taki,

}
