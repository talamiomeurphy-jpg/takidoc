<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogue des Documents - TakiDoc</title>
    <meta name="description" content="Parcourez notre catalogue de plus de 200 modèles de documents professionnels : CV, contrats, factures, attestations.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Header dynamique -->
    <link rel="stylesheet" href="/css/header.css">
    
    <style>
        /* ============================================
           PAGE DOCUMENTS - STYLES SPÉCIFIQUES
           ============================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            color: #1e293b;
            line-height: 1.6;
        }

        /* HERO SECTION AVEC VRAIE IMAGE */
        .docs-hero {
            position: relative;
            background: url('https://images.unsplash.com/photo-1450101499163-c8848c66ca85?w=1600&auto=format&fit=crop') center/cover no-repeat;
            padding: 6rem 2rem 5rem;
            text-align: center;
            color: white;
        }

        .docs-hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.9) 0%, rgba(30, 41, 59, 0.85) 100%);
        }

        .docs-hero-content {
            position: relative;
            z-index: 1;
            max-width: 800px;
            margin: 0 auto;
        }

        .docs-hero h1 {
            font-size: 2.75rem;
            font-weight: 800;
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .docs-hero p {
            font-size: 1.125rem;
            color: #cbd5e1;
            margin-bottom: 2.5rem;
        }

        /* BARRE DE RECHERCHE */
        .search-wrapper {
            position: relative;
            max-width: 600px;
            margin: 0 auto;
        }

        .search-wrapper i {
            position: absolute;
            left: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 1.1rem;
        }

        .search-input {
            width: 100%;
            padding: 1.125rem 1.25rem 1.125rem 3.5rem;
            border: 2px solid transparent;
            border-radius: 12px;
            font-size: 1rem;
            font-family: inherit;
            background: white;
            color: #1e293b;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            transition: all 0.3s;
        }

        .search-input:focus {
            outline: none;
            border-color: #f97316;
            box-shadow: 0 10px 40px rgba(249, 115, 22, 0.2);
        }

        .search-input::placeholder {
            color: #94a3b8;
        }

        /* LAYOUT PRINCIPAL (Sidebar + Grid) */
        .docs-layout {
            max-width: 1280px;
            margin: 0 auto;
            padding: 3rem 2rem;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 3rem;
        }

        /* SIDEBAR CATÉGORIES */
        .docs-sidebar {
            position: sticky;
            top: 100px;
            height: fit-content;
        }

        .sidebar-title {
            font-size: 0.875rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
            margin-bottom: 1rem;
        }

        .category-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .category-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.875rem 1rem;
            border-radius: 8px;
            text-decoration: none;
            color: #475569;
            font-weight: 500;
            font-size: 0.9375rem;
            transition: all 0.2s;
            background: white;
            border: 1px solid #e2e8f0;
        }

        .category-link:hover, .category-link.active {
            background: #fff7ed;
            border-color: #f97316;
            color: #f97316;
        }

        .category-link i {
            width: 20px;
            text-align: center;
            margin-right: 0.75rem;
        }

        .category-count {
            background: #f1f5f9;
            color: #64748b;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.25rem 0.6rem;
            border-radius: 20px;
        }

        .category-link.active .category-count {
            background: #f97316;
            color: white;
        }

        /* GRILLE DE DOCUMENTS */
        .docs-main {
            min-height: 500px;
        }

        .category-section {
            margin-bottom: 3.5rem;
            scroll-margin-top: 120px; /* Pour le scroll smooth avec le header sticky */
        }

        .category-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid #e2e8f0;
        }

        .category-header i {
            color: #f97316;
            font-size: 1.25rem;
        }

        .category-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1e293b;
        }

        .docs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        /* CARTES DOCUMENTS (Style amélioré) */
        .doc-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .doc-card:hover {
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            transform: translateY(-4px);
            border-color: #f97316;
        }

        .doc-thumbnail {
            width: 100%;
            height: 140px;
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            border-bottom: 1px solid #e2e8f0;
        }

        .doc-thumbnail-inner {
            width: 85%;
            height: 85%;
            background: white;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            transform: scale(0.85);
        }

        .doc-thumb-line {
            height: 5px;
            background: #e2e8f0;
            border-radius: 2px;
        }
        .doc-thumb-line.short { width: 60%; }
        .doc-thumb-line.medium { width: 80%; }
        .doc-thumb-line.long { width: 100%; }

        .doc-card-body {
            padding: 1.25rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .doc-card h3 {
            font-size: 1rem;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 0.5rem;
            line-height: 1.4;
        }

        .doc-card p {
            font-size: 0.8125rem;
            color: #64748b;
            margin-bottom: 1rem;
            line-height: 1.5;
            flex: 1;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .doc-card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1rem;
            border-top: 1px solid #f1f5f9;
        }

        .doc-price {
            font-size: 1.125rem;
            font-weight: 700;
            color: #f97316;
        }

        .btn-doc {
            padding: 0.5rem 1rem;
            background: #f97316;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.8125rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-doc:hover {
            background: #ea580c;
        }

        /* MESSAGE AUCUN RÉSULTAT */
        .no-results {
            text-align: center;
            padding: 4rem 2rem;
            color: #64748b;
        }
        .no-results i {
            font-size: 3rem;
            color: #cbd5e1;
            margin-bottom: 1rem;
        }

        /* FOOTER (Identique à index.html) */
        .footer {
            background: #1e293b;
            color: #94a3b8;
            padding: 3rem 0 2rem;
            margin-top: 4rem;
        }
        .footer-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 2rem;
            text-align: center;
        }

        /* RESPONSIVE */
        @media (max-width: 1024px) {
            .docs-layout {
                grid-template-columns: 1fr;
                gap: 2rem;
            }
            .docs-sidebar {
                position: relative;
                top: 0;
                overflow-x: auto;
                padding-bottom: 1rem;
            }
            .category-list {
                flex-direction: row;
                flex-wrap: nowrap;
            }
            .category-link {
                white-space: nowrap;
            }
        }

        @media (max-width: 768px) {
            .docs-hero {
                padding: 4rem 1.5rem 3rem;
            }
            .docs-hero h1 {
                font-size: 2rem;
            }
            .docs-layout {
                padding: 2rem 1rem;
            }
            .docs-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- Header dynamique généré par header.js -->
    <div id="header-container"></div>

    <!-- Hero Section avec vraie image -->
    <section class="docs-hero">
        <div class="docs-hero-content">
            <h1>Explorez notre catalogue complet</h1>
            <p>Plus de 200 modèles de documents professionnels, juridiques et administratifs prêts à être personnalisés.</p>
            
            <div class="search-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" class="search-input" id="globalSearch" placeholder="Rechercher un document (ex: CV, Facture, Contrat...)">
            </div>
        </div>
    </section>

    <!-- Layout Principal -->
    <div class="docs-layout">
        <!-- Sidebar Catégories -->
        <aside class="docs-sidebar">
            <div class="sidebar-title">Catégories</div>
            <ul class="category-list" id="categoryList">
                <!-- Injecté par JS -->
            </ul>
        </aside>

        <!-- Contenu Principal -->
        <main class="docs-main" id="all-documents">
            <!-- Injecté par JS -->
        </main>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-container">
            <p>&copy; 2026 TakiDoc. Tous droits réservés. Développé par L'équipe Meurphy.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="/js/header.js"></script>
    <script type="module">
        import { templatesRegistry } from './js/templates-registry.js';
        
        // Configuration des catégories
        const categories = {
            'cv': { name: 'CV & Emploi', icon: 'fa-briefcase', docs: [] },
            'lettre': { name: 'Lettres', icon: 'fa-envelope', docs: [] },
            'attestation': { name: 'Attestations', icon: 'fa-certificate', docs: [] },
            'contrat': { name: 'Contrats', icon: 'fa-file-contract', docs: [] },
            'commercial': { name: 'Commercial', icon: 'fa-file-invoice', docs: [] },
            'administratif': { name: 'Administratif', icon: 'fa-building', docs: [] }
        };
        
        // Trier les documents par catégorie
        templatesRegistry.forEach(doc => {
            if (categories[doc.category]) {
                categories[doc.category].docs.push(doc);
            }
        });
        
        const categoryListEl = document.getElementById('categoryList');
        const mainContentEl = document.getElementById('all-documents');
        const searchInput = document.getElementById('globalSearch');
        
        // Fonction pour générer une miniature réaliste
        function generateRealisticThumbnail(doc) {
            const name = doc.name.toLowerCase();
            if (name.includes('cv')) {
                return `<div class="doc-thumbnail-inner" style="background: linear-gradient(135deg, #1e293b 0%, #334155 100%); color: white;">
                    <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 6px;">
                        <div style="width: 20px; height: 20px; background: rgba(255,255,255,0.2); border-radius: 50%;"></div>
                        <div style="font-size: 0.55rem; font-weight: 700;">CV</div>
                    </div>
                    <div class="doc-thumb-line medium" style="background: rgba(255,255,255,0.3);"></div>
                    <div class="doc-thumb-line short" style="background: rgba(255,255,255,0.3);"></div>
                </div>`;
            }
            if (name.includes('facture') || name.includes('devis')) {
                return `<div class="doc-thumbnail-inner">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
                        <div style="font-size: 0.55rem; font-weight: 700;">ENTREPRISE</div>
                        <div style="background: #f97316; color: white; padding: 1px 4px; border-radius: 2px; font-size: 0.5rem;">FACTURE</div>
                    </div>
                    <div class="doc-thumb-line long" style="background: #f1f5f9;"></div>
                    <div class="doc-thumb-line medium" style="background: #f1f5f9;"></div>
                </div>`;
            }
            if (name.includes('attestation')) {
                return `<div class="doc-thumbnail-inner" style="border: 2px solid #1e293b;">
                    <div style="text-align: center; font-size: 0.55rem; font-weight: 700; border-bottom: 1px solid #1e293b; padding-bottom: 4px; margin-bottom: 6px;">ENTREPRISE XYZ</div>
                    <div style="text-align: center; font-size: 0.55rem; font-weight: 700; color: #f97316;">ATTESTATION</div>
                    <div class="doc-thumb-line medium" style="background: #f1f5f9; margin: 6px auto;"></div>
                </div>`;
            }
            // Générique
            return `<div class="doc-thumbnail-inner">
                <div style="text-align: center; font-size: 0.55rem; font-weight: 700; border-bottom: 1px solid #1e293b; padding-bottom: 4px; margin-bottom: 6px;">${doc.name.substring(0, 15).toUpperCase()}</div>
                <div class="doc-thumb-line long" style="background: #f1f5f9;"></div>
                <div class="doc-thumb-line medium" style="background: #f1f5f9;"></div>
            </div>`;
        }

        // Fonction d'affichage
        function renderDocuments(filterText = '') {
            categoryListEl.innerHTML = '';
            mainContentEl.innerHTML = '';
            const lowerFilter = filterText.toLowerCase();
            let hasResults = false;
            
            for (const [key, cat] of Object.entries(categories)) {
                // Filtrer les docs de cette catégorie
                const filteredDocs = cat.docs.filter(doc => 
                    doc.name.toLowerCase().includes(lowerFilter) || 
                    doc.description.toLowerCase().includes(lowerFilter)
                );
                
                if (filteredDocs.length > 0) {
                    hasResults = true;
                    
                    // Ajouter à la sidebar
                    const li = document.createElement('li');
                    li.innerHTML = `
                        <a href="#category-${key}" class="category-link" data-category="${key}">
                            <span><i class="fas ${cat.icon}"></i> ${cat.name}</span>
                            <span class="category-count">${filteredDocs.length}</span>
                        </a>
                    `;
                    categoryListEl.appendChild(li);
                    
                    // Ajouter la section au main
                    const section = document.createElement('section');
                    section.className = 'category-section';
                    section.id = `category-${key}`;
                    section.innerHTML = `
                        <div class="category-header">
                            <i class="fas ${cat.icon}"></i>
                            <h2>${cat.name}</h2>
                        </div>
                        <div class="docs-grid">
                            ${filteredDocs.map(doc => `
                                <div class="doc-card" onclick="window.location.href='editor.html?id=${doc.id}'">
                                    <div class="doc-thumbnail">
                                        ${generateRealisticThumbnail(doc)}
                                    </div>
                                    <div class="doc-card-body">
                                        <h3>${doc.name}</h3>
                                        <p>${doc.description}</p>
                                        <div class="doc-card-footer">
                                            <span class="doc-price">${doc.price.toLocaleString()} FCFA</span>
                                            <button class="btn-doc">Personnaliser</button>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                    mainContentEl.appendChild(section);
                }
            }
            
            if (!hasResults) {
                mainContentEl.innerHTML = `
                    <div class="no-results">
                        <i class="fas fa-search"></i>
                        <h3>Aucun document trouvé</h3>
                        <p>Essayez avec d'autres mots-clés comme "CV", "Contrat" ou "Facture".</p>
                    </div>
                `;
            }
            
            // Gestion du scroll smooth pour les liens de la sidebar
            document.querySelectorAll('.category-link').forEach(link => {
                link.addEventListener('click', (e) => {
                    document.querySelectorAll('.category-link').forEach(l => l.classList.remove('active'));
                    link.classList.add('active');
                });
            });
        }
        
        // Initial render
        renderDocuments();
        
        // Écouteur de recherche en temps réel
        searchInput.addEventListener('input', (e) => {
            renderDocuments(e.target.value);
        });
        
        // Filtrer par catégorie si paramètre URL (ex: ?category=cv)
        const urlParams = new URLSearchParams(window.location.search);
        const categoryFilter = urlParams.get('category');
        if (categoryFilter && categories[categoryFilter]) {
            setTimeout(() => {
                const target = document.getElementById(`category-${categoryFilter}`);
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth' });
                    // Activer le lien dans la sidebar
                    const activeLink = document.querySelector(`.category-link[data-category="${categoryFilter}"]`);
                    if (activeLink) activeLink.classList.add('active');
                }
            }, 100);
        }
    </script>
</body>
</html>
